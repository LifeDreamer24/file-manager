<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FM">
  <defs>
    <linearGradient id="background" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263c35" />
      <stop offset="0.55" stop-color="#17231f" />
      <stop offset="1" stop-color="#101713" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(18 13) rotate(45) scale(45)">
      <stop stop-color="#42d392" stop-opacity="0.52" />
      <stop offset="0.72" stop-color="#42d392" stop-opacity="0.08" />
      <stop offset="1" stop-color="#42d392" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#aaf1cd" fill-opacity="0.34" />
    </pattern>
    <clipPath id="icon-shape">
      <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" />
    </clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#background)" stroke="#56dfa0" stroke-width="3" />
  <g clip-path="url(#icon-shape)">
    <rect x="3.5" y="3.5" width="57" height="57" fill="url(#glow)" />
    <rect x="3.5" y="3.5" width="57" height="57" fill="url(#dots)" />
  </g>
  <text
    x="32"
    y="40"
    fill="#c3f8dc"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="25"
    font-weight="800"
    letter-spacing="-1"
    text-anchor="middle"
  >FM</text>
</svg>
